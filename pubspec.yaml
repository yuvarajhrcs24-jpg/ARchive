name: archive
description: A location-based smart tour guide app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Maps
  google_maps_flutter: ^2.7.0

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Local DB
  sqflite: ^2.3.3
  path: ^1.9.0

  # Audio
  audioplayers: ^6.1.0

  # Images
  cached_network_image: ^3.3.1

  # HTTP
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.5

  # Crypto/storage
  crypto: ^3.0.3
  shared_preferences: ^2.2.3

  # Permissions
  permission_handler: ^11.3.1

  # URL launcher
  url_launcher: ^6.3.1

  # File system
  path_provider: ^2.1.3

  # UUID generation
  uuid: ^4.4.0

  # UI
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/
